name: CI

on: [ push, pull_request ]

env:
  DEFAULT_NODE: '24'

jobs:
  lockfile-lint:
    name: Lockfile lint
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.DEFAULT_NODE }}
      - name: lint lock file
        run: npx lockfile-lint --path package-lock.json --allowed-hosts npm --validate-http
  
  test:
    strategy:
      matrix:
        platform: [ ubuntu-latest ]
        node: [ '24' ]
    name: Unit Tests Node ${{ matrix.node }} (${{ matrix.platform }})
    needs: lockfile-lint
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: install dependencies
        run: npm ci --ignore-scripts
      - name: unit tests
        run: npm run test:coverage
      - name: upload code coverage artifacts
        if: ${{ matrix.node == env.DEFAULT_NODE }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage

  coverage:
    needs: [test, lockfile-lint]
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.DEFAULT_NODE }}
      - name: install dependencies
        run: npm ci --ignore-scripts
      - name: download code coverage artifacts
        uses: actions/download-artifact@v7
        with:
          name: coverage
          path: coverage
      - name: publish coverage to coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  lint:
    needs: lockfile-lint
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.DEFAULT_NODE }}
      - name: install dependencies
        run: npm ci --ignore-scripts
      - name: lint
        run: npm run lint